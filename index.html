<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Calificaciones Escolares</title>

    <!-- Estilos CSS integrados -->
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            background-color: #cbd5e1;
            color: #334155;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .panel {
            display: none;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .panel.active {
            display: block;
        }

        h2 {
            color: var(--primary);
            margin-top: 0;
        }

        .search-box, .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        button.btn-primary {
            background-color: var(--primary-light);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
        }

        button.btn-primary:hover {
            background-color: var(--primary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 12px;
            text-align: center;
            font-size: 0.9rem;
        }

        th {
            background-color: var(--primary);
            color: white;
        }

        .materia-header {
            background-color: #f1f5f9;
            font-weight: bold;
            text-align: left;
        }

        .sub-table {
            width: 100%;
            font-size: 0.85rem;
            margin: 5px 0;
        }

        .sub-table th {
            background-color: #64748b;
        }

        .promedio-destacado {
            font-weight: bold;
            color: #047857;
            background-color: #ecfdf5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Portal Escolar de Calificaciones</h1>

    <!-- Pestañas de Selección -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="cambiarVista('estudiante')">Vista Estudiante</button>
        <button class="tab-btn" onclick="cambiarVista('profesor')">Panel del Profesor</button>
    </div>

    <!-- VISTA ESTUDIANTE -->
    <div id="vista-estudiante" class="panel active">
        <h2>Consulta de Notas por Estudiante</h2>
        <div class="search-box">
            <label for="buscarNombre">Nombre completo del Estudiante:</label>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="buscarNombre" placeholder="Ej. Juan Pérez">
                <button class="btn-primary" onclick="consultarNotas()">Consultar</button>
            </div>
        </div>

        <div id="resultadoEstudiante"></div>
    </div>

    <!-- VISTA PROFESOR -->
    <div id="vista-profesor" class="panel">
        <h2>Ingreso de Calificaciones</h2>
        <form id="formProfesor" onsubmit="guardarNotas(event)">
            <div class="form-group">
                <label for="profNombre">Nombre del Estudiante:</label>
                <input type="text" id="profNombre" required placeholder="Ej. Juan Pérez">
            </div>

            <div class="grid-inputs">
                <div>
                    <label for="profMateria">Materia:</label>
                    <select id="profMateria" required></select>
                </div>
                <div>
                    <label for="profBimestre">Bimestre:</label>
                    <select id="profBimestre" required>
                        <option value="b1">1° Bimestre</option>
                        <option value="b2">2° Bimestre</option>
                        <option value="b3">3° Bimestre</option>
                        <option value="b4">4° Bimestre</option>
                    </select>
                </div>
            </div>

            <h3>Desglose de Puntos</h3>
            <div class="grid-inputs">
                <div>
                    <label for="pTareas">Puntos por Tarea:</label>
                    <input type="number" id="pTareas" min="0" max="100" value="0" required>
                </div>
                <div>
                    <label for="pParcial">Parcial / Laboratorio:</label>
                    <input type="number" id="pParcial" min="0" max="100" value="0" required>
                </div>
                <div>
                    <label for="pExposicion">Puntos por Exposición:</label>
                    <input type="number" id="pExposicion" min="0" max="100" value="0" required>
                </div>
                <div>
                    <label for="pGrupo">Trabajo en Grupo:</label>
                    <input type="number" id="pGrupo" min="0" max="100" value="0" required>
                </div>
            </div>

            <button type="submit" class="btn-primary">Guardar / Actualizar Notas</button>
        </form>
    </div>
</div>

<script>
    // Configuración de Materias Requeridas
    const LISTA_MATERIAS = [
        "Matemáticas",
        "Ciencias Sociales",
        "Ciencias Naturales",
        "Educación Física",
        "Expresión Artística",
        "Inglés",
        "Xinca",
        "Emprendimiento",
        "Tecnología",
        "Comunicación y Lenguaje"
    ];

    const BIMESTRES = ["b1", "b2", "b3", "b4"];

    // Cargar materias en el selector del profesor
    const selectMateria = document.getElementById('profMateria');
    LISTA_MATERIAS.forEach(mat => {
        const option = document.createElement('option');
        option.value = mat;
        option.textContent = mat;
        selectMateria.appendChild(option);
    });

    // Control de pestañas
    function cambiarVista(vista) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

        if (vista === 'estudiante') {
            document.getElementById('vista-estudiante').classList.add('active');
            event.target.classList.add('active');
        } else {
            document.getElementById('vista-profesor').classList.add('active');
            event.target.classList.add('active');
        }
    }

    // Funciones para manejo de datos (LocalStorage)
    function obtenerDatos() {
        return JSON.parse(localStorage.getItem('bd_escuela')) || {};
    }

    function guardarDatosBD(datos) {
        localStorage.setItem('bd_escuela', JSON.stringify(datos));
    }

    // Guardar Notas (Profesor)
    function guardarNotas(e) {
        e.preventDefault();
        const nombre = document.getElementById('profNombre').value.trim().toLowerCase();
        const materia = document.getElementById('profMateria').value;
        const bimestre = document.getElementById('profBimestre').value;

        const tareas = parseFloat(document.getElementById('pTareas').value) || 0;
        const parcial = parseFloat(document.getElementById('pParcial').value) || 0;
        const exposicion = parseFloat(document.getElementById('pExposicion').value) || 0;
        const grupo = parseFloat(document.getElementById('pGrupo').value) || 0;

        let bd = obtenerDatos();

        if (!bd[nombre]) bd[nombre] = {};
        if (!bd[nombre][materia]) bd[nombre][materia] = {};

        bd[nombre][materia][bimestre] = {
            tareas,
            parcial,
            exposicion,
            grupo,
            total: tareas + parcial + exposicion + grupo
        };

        guardarDatosBD(bd);
        alert('Notas guardadas correctamente para ' + document.getElementById('profNombre').value);
        document.getElementById('formProfesor').reset();
    }

    // Consultar Notas (Estudiante)
    function consultarNotas() {
        const nombreInput = document.getElementById('buscarNombre').value.trim().toLowerCase();
        const contenedor = document.getElementById('resultadoEstudiante');
        const bd = obtenerDatos();

        if (!nombreInput || !bd[nombreInput]) {
            contenedor.innerHTML = '<p style="color: red; font-weight: bold; margin-top:20px;">No se encontraron registros para ese estudiante.</p>';
            return;
        }

        const datosEstudiante = bd[nombreInput];
        let html = `<h3>Boletín de Calificaciones: ${document.getElementById('buscarNombre').value}</h3>`;

        html += `
        <table>
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>1° Bimestre</th>
                    <th>2° Bimestre</th>
                    <th>3° Bimestre</th>
                    <th>4° Bimestre</th>
                    <th>Promedio Final Anual</th>
                </tr>
            </thead>
            <tbody>`;

        LISTA_MATERIAS.forEach(materia => {
            const datosMateria = datosEstudiante[materia] || {};
            let sumaPromedio = 0;
            let bimestresConNota = 0;

            html += `<tr><td class="materia-header">${materia}</td>`;

            BIMESTRES.forEach(bim => {
                const info = datosMateria[bim];
                if (info) {
                    sumaPromedio += info.total;
                    bimestresConNota++;
                    html += `
                    <td>
                        <strong>Total: ${info.total.toFixed(1)} pts</strong>
                        <table class="sub-table">
                            <tr><th>Tareas</th><td>${info.tareas}</td></tr>
                            <tr><th>Parcial/Lab</th><td>${info.parcial}</td></tr>
                            <tr><th>Exposición</th><td>${info.exposicion}</td></tr>
                            <tr><th>Trabajo Grupo</th><td>${info.grupo}</td></tr>
                        </table>
                    </td>`;
                } else {
                    html += `<td><em>Sin datos</em></td>`;
                }
            });

            const promedioFinal = bimestresConNota > 0 ? (sumaPromedio / bimestresConNota).toFixed(1) : '-';
            html += `<td class="promedio-destacado">${promedioFinal} pts</td></tr>`;
        });

        html += `</tbody></table>`;
        contenedor.innerHTML = html;
    }
</script>

</body>
</html>
