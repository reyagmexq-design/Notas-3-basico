<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INEB Telesecundaria Estanzuela - Sistema de Calificaciones</title>

    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #334155;
            --accent-orange: #f97316;
            --accent-orange-hover: #ea580c;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
        }

        /* Pantalla de Carga (Splash Screen) */
        #pantalla-carga {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            box-sizing: border-box;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #pantalla-carga h1 {
            color: #1e3a8a;
            font-size: 1.5rem;
            margin: 0 0 10px 0;
            text-align: center;
            text-transform: uppercase;
        }

        #pantalla-carga h2 {
            color: #475569;
            font-size: 1.1rem;
            font-weight: normal;
            margin: 0 0 25px 0;
            text-align: center;
        }

        .btn-entrar {
            background-color: var(--accent-orange);
            color: white;
            border: none;
            padding: 12px 36px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-entrar:active {
            transform: scale(0.98);
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        .nav-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            border: 1px solid #cbd5e1;
            background-color: #e2e8f0;
            color: #1e293b;
            cursor: pointer;
            border-radius: 6px;
            flex: 1;
            min-width: 140px;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .panel {
            display: none;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .panel.active {
            display: block;
        }

        h2, h3, h4 {
            color: #0f172a;
            margin-top: 0;
            text-align: center;
        }

        .search-box, .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 8px;
            border: 1px solid #94a3b8;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        button.btn-primary {
            background-color: var(--primary-light);
            color: white;
            border: none;
            padding: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        .tarjeta-reporte {
            border: 2px solid #000;
            background-color: #fff;
            padding: 10px;
            margin-top: 15px;
            font-family: 'Arial Narrow', Arial, sans-serif;
        }

        .nota-header-box {
            border: 1.5px solid #000;
            border-radius: 12px;
            padding: 8px;
            font-size: 0.78rem;
            text-align: justify;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .tabla-oficial {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }

        .tabla-oficial th, .tabla-oficial td {
            border: 1.5px solid #000;
            padding: 5px 6px;
            text-align: center;
        }

        .tabla-oficial th {
            background-color: #f1f5f9;
            font-weight: bold;
            color: #000;
            text-transform: uppercase;
        }

        .tabla-oficial td.col-materia {
            text-align: left;
            font-weight: bold;
        }

        .sub-table {
            width: 100%;
            font-size: 0.75rem;
            border-collapse: collapse;
            margin-top: 3px;
        }

        .sub-table td {
            border: 1px solid #cbd5e1;
            padding: 2px 4px;
        }

        .col-destacada {
            font-weight: bold;
            background-color: #f8fafc;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            background: #f1f5f9;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<!-- Pantalla de Carga Inicial con Botón Naranja -->
<div id="pantalla-carga">
    <h1>INEB TELESECUNDARIA ALDEA ESTANZUELA</h1>
    <h2>Sistema de Notas</h2>
    <button class="btn-entrar" onclick="ingresarSistema()">Entrar</button>
</div>

<div class="container">
    <h2 style="margin-bottom: 5px;">INEB TELESECUNDARIA ESTANZUELA</h2>
    <p style="text-align:center; font-size:0.85rem; margin-top:0; color:#475569;">Sistema de Control Escolar y Boletín Digital</p>

    <!-- Opciones / Pestañas principales -->
    <div class="nav-tabs">
        <button class="tab-btn active" id="btnPuntos" onclick="cambiarVista('desglose')">1. Desglose de Puntos</button>
        <button class="tab-btn" id="btnBoletin" onclick="cambiarVista('boletin')">2. Boletín Oficial de Notas</button>
        <button class="tab-btn" id="btnProfesor" onclick="cambiarVista('profesor')">Panel Profesor 🔒</button>
    </div>

    <!-- 1. OPCIÓN DESGLOSE DE PUNTOS -->
    <div id="vista-desglose" class="panel active">
        <h3>Consulta: Desglose de Puntos por Actividad</h3>
        <div class="search-box">
            <label for="buscarNombreDesglose">Escribe tu Nombre Completo:</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="buscarNombreDesglose" placeholder="Ej. Juan Pérez">
                <button class="btn-primary" style="width: auto;" onclick="consultarDesglose()">Consultar</button>
            </div>
        </div>
        <div id="resultadoDesglose"></div>
    </div>

    <!-- 2. OPCIÓN BOLETÍN OFICIAL -->
    <div id="vista-boletin" class="panel">
        <h3>Consulta: Reporte de Notas Bimestrales</h3>
        <div class="search-box">
            <label for="buscarNombreBoletin">Escribe tu Nombre Completo:</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="buscarNombreBoletin" placeholder="Ej. Juan Pérez">
                <button class="btn-primary" style="width: auto;" onclick="consultarBoletin()">Ver Boletín</button>
            </div>
        </div>
        <div id="resultadoBoletin"></div>
    </div>

    <!-- 3. PANEL DEL PROFESOR (CON CLAVE) -->
    <div id="vista-profesor" class="panel">
        <h3>Ingreso de Notas (Docentes)</h3>
        <form id="formProfesor" onsubmit="guardarNotas(event)">
            <div class="form-group">
                <label for="profNombre">Nombre Completo del Estudiante:</label>
                <input type="text" id="profNombre" required placeholder="Ej. Juan Pérez">
            </div>

            <div class="grid-inputs">
                <div>
                    <label for="profMateria">Asignatura / Materia:</label>
                    <select id="profMateria" required></select>
                </div>
                <div>
                    <label for="profBimestre">Bimestre:</label>
                    <select id="profBimestre" required>
                        <option value="b1">Primer Bimestre</option>
                        <option value="b2">Segundo Bimestre</option>
                        <option value="b3">Tercer Bimestre</option>
                        <option value="b4">Cuarto Bimestre</option>
                    </select>
                </div>
            </div>

            <label>Tipo de Registro:</label>
            <div class="radio-group">
                <label style="font-weight:normal; cursor:pointer;">
                    <input type="radio" name="tipoIngreso" value="boletin" checked onclick="toggleModoIngreso()"> Nota Directa (Para Boletín)
                </label>
                <label style="font-weight:normal; cursor:pointer;">
                    <input type="radio" name="tipoIngreso" value="desglose" onclick="toggleModoIngreso()"> Desglose por Rubros
                </label>
            </div>

            <!-- OPCION A: NOTA DIRECTA PARA BOLETÍN -->
            <div id="modoBoletin" class="form-group">
                <label for="pNotaDirecta">Nota Final del Bimestre (0 a 100):</label>
                <input type="number" id="pNotaDirecta" min="0" max="100" step="0.1" value="0">
            </div>

            <!-- OPCION B: DESGLOSE POR RUBROS -->
            <div id="modoDesglose" style="display:none;">
                <h4 style="text-align:left; border-bottom:1px solid #ccc; padding-bottom:5px;">Rubros de Evaluación</h4>
                <div class="grid-inputs">
                    <div>
                        <label for="pTareas">Puntos por Tarea:</label>
                        <input type="number" id="pTareas" min="0" max="100" step="0.1" value="0">
                    </div>
                    <div>
                        <label for="pParcial">Laboratorio / Parcial:</label>
                        <input type="number" id="pParcial" min="0" max="100" step="0.1" value="0">
                    </div>
                    <div>
                        <label for="pExposicion">Puntos por Exposición:</label>
                        <input type="number" id="pExposicion" min="0" max="100" step="0.1" value="0">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-primary">Guardar Calificación</button>
        </form>
    </div>
</div>

<script>
    function ingresarSistema() {
        const pantallaCarga = document.getElementById('pantalla-carga');
        pantallaCarga.style.opacity = '0';
        pantallaCarga.style.visibility = 'hidden';
    }

    const CLAVE_PROFESOR = "Ineb Telesecundaria Estanzuela";

    const LISTA_MATERIAS = [
        "Matemáticas",
        "Culturas e idiomas Garífunas o Xinka",
        "Comunicación y Lenguaje Idioma Español",
        "Comunicación y Lenguaje Idioma Extranjero",
        "Ciencias Naturales",
        "Ciencias Sociales, Formación Ciudadana E Interculturalidad",
        "Educación Musical",
        "Artes Visuales",
        "Teatro",
        "Danza",
        "Emprendimiento para la Productividad",
        "Tecnologías del Aprendizaje y la Comunicación",
        "Educación Física"
    ];

    const BIMESTRES = ["b1", "b2", "b3", "b4"];

    const selectMateria = document.getElementById('profMateria');
    LISTA_MATERIAS.forEach(mat => {
        const option = document.createElement('option');
        option.value = mat;
        option.textContent = mat;
        selectMateria.appendChild(option);
    });

    function cambiarVista(vista) {
        if (vista === 'profesor') {
            const clave = prompt("Ingrese la contraseña del docente:");
            if (clave !== CLAVE_PROFESOR) {
                alert("Contraseña incorrecta. Acceso denegado.");
                return;
            }
        }

        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

        if (vista === 'desglose') {
            document.getElementById('vista-desglose').classList.add('active');
            document.getElementById('btnPuntos').classList.add('active');
        } else if (vista === 'boletin') {
            document.getElementById('vista-boletin').classList.add('active');
            document.getElementById('btnBoletin').classList.add('active');
        } else {
            document.getElementById('vista-profesor').classList.add('active');
            document.getElementById('btnProfesor').classList.add('active');
        }
    }

    function toggleModoIngreso() {
        const modo = document.querySelector('input[name="tipoIngreso"]:checked').value;
        if (modo === 'boletin') {
            document.getElementById('modoBoletin').style.display = 'block';
            document.getElementById('modoDesglose').style.display = 'none';
        } else {
            document.getElementById('modoBoletin').style.display = 'none';
            document.getElementById('modoDesglose').style.display = 'block';
        }
    }

    function obtenerBD() {
        return JSON.parse(localStorage.getItem('bd_telesecundaria')) || {};
    }

    function guardarBD(datos) {
        localStorage.setItem('bd_telesecundaria', JSON.stringify(datos));
    }

    function guardarNotas(e) {
        e.preventDefault();
        const nombre = document.getElementById('profNombre').value.trim().toLowerCase();
        const materia = document.getElementById('profMateria').value;
        const bimestre = document.getElementById('profBimestre').value;
        const modo = document.querySelector('input[name="tipoIngreso"]:checked').value;

        let bd = obtenerBD();
        if (!bd[nombre]) bd[nombre] = {};
        if (!bd[nombre][materia]) bd[nombre][materia] = {};

        if (modo === 'boletin') {
            const notaDirecta = parseFloat(document.getElementById('pNotaDirecta').value) || 0;
            bd[nombre][materia][bimestre] = {
                tareas: 0,
                parcial: 0,
                exposicion: 0,
                total: notaDirecta
            };
        } else {
            const tareas = parseFloat(document.getElementById('pTareas').value) || 0;
            const parcial = parseFloat(document.getElementById('pParcial').value) || 0;
            const exposicion = parseFloat(document.getElementById('pExposicion').value) || 0;
            bd[nombre][materia][bimestre] = {
                tareas,
                parcial,
                exposicion,
                total: tareas + parcial + exposicion
            };
        }

        guardarBD(bd);
        alert('Nota guardada correctamente para ' + document.getElementById('profNombre').value);
        document.getElementById('formProfesor').reset();
        toggleModoIngreso();
    }

    function consultarDesglose() {
        const nombre = document.getElementById('buscarNombreDesglose').value.trim().toLowerCase();
        const cont = document.getElementById('resultadoDesglose');
        const bd = obtenerBD();

        if (!nombre || !bd[nombre]) {
            cont.innerHTML = '<p style="color:red; font-weight:bold;">No hay registros para este estudiante.</p>';
            return;
        }

        let html = `<h4 style="text-align:left;">Desglose de Tareas, Parciales y Exposiciones</h4><div style="overflow-x:auto;"><table class="tabla-oficial"><thead><tr><th>ASIGNATURAS</th><th>Primer Bimestre</th><th>Segundo Bimestre</th><th>Tercer Bimestre</th><th>Cuarto Bimestre</th></tr></thead><tbody>`;

        LISTA_MATERIAS.forEach(mat => {
            html += `<tr><td class="col-materia">${mat}</td>`;
            BIMESTRES.forEach(bim => {
                const info = bd[nombre][mat] ? bd[nombre][mat][bim] : null;
                if (info) {
                    html += `<td>
                        <strong>Total: ${info.total.toFixed(1)}</strong>
                        <table class="sub-table">
                            <tr><td>Tareas</td><td>${info.tareas}</td></tr>
                            <tr><td>Lab/Parcial</td><td>${info.parcial}</td></tr>
                            <tr><th>Expo</th><td>${info.exposicion}</td></tr>
                        </table>
                    </td>`;
                } else {
                    html += `<td>-</td>`;
                }
            });
            html += `</tr>`;
        });

        html += `</tbody></table></div>`;
        cont.innerHTML = html;
    }

    function consultarBoletin() {
        const nombreOriginal = document.getElementById('buscarNombreBoletin').value.trim();
        const nombreKey = nombreOriginal.toLowerCase();
        const cont = document.getElementById('resultadoBoletin');
        const bd = obtenerBD();

        if (!nombreKey || !bd[nombreKey]) {
            cont.innerHTML = '<p style="color:red; font-weight:bold;">No se encontraron calificaciones registradas para este estudiante.</p>';
            return;
        }

        let html = `
        <div class="tarjeta-reporte">
            <div class="nota-header-box">
                <strong>Padres de Familia:</strong> Este es un reporte que resume en nota numérica, los resultados obtenidos por su hijo (a) en su desempeño escolar. Se le solicita leer cuidadosamente este informe y devolverlo al Docente de Grado el día indicado. <strong>NOTA: Las asignaturas son APROBADAS de 60 a 100 puntos y son REPROBADAS de 0 a 59 puntos.</strong>
            </div>
            
            <p style="margin: 5px 0; font-weight:bold; font-size:0.9rem;">Alumno(a): <span style="text-transform:uppercase;">${nombreOriginal}</span></p>

            <table class="tabla-oficial">
                <thead>
                    <tr>
                        <th style="width: 45%;">ASIGNATURAS</th>
                        <th>Primer Bimestre</th>
                        <th>Segundo Bimestre</th>
                        <th>Tercer Bimestre</th>
                        <th>Cuarto Bimestre</th>
                        <th>NOTA FINAL</th>
                    </tr>
                </thead>
                <tbody>`;

        LISTA_MATERIAS.forEach(mat => {
            let suma = 0;
            let conteo = 0;
            html += `<tr><td class="col-materia">${mat}</td>`;

            BIMESTRES.forEach(bim => {
                const info = bd[nombreKey][mat] ? bd[nombreKey][mat][bim] : null;
                if (info) {
                    suma += info.total;
                    conteo++;
                    html += `<td>${info.total.toFixed(0)}</td>`;
                } else {
                    html += `<td></td>`;
                }
            });

            const notaFinal = conteo > 0 ? (suma / conteo).toFixed(0) : '';
            html += `<td class="col-destacada">${notaFinal}</td></tr>`;
        });

        html += `</tbody></table></div>`;
        cont.innerHTML = html;
    }
</script>

</body>
</html>
